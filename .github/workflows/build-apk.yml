name: Build JARVIS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          unzip -o JARVIS_Prototype_v2_Cloud_Build.zip -d source
          find source -maxdepth 4 -type f

      - name: Prepare Android project
        run: |
          SRC=$(find source -name settings.gradle -o -name settings.gradle.kts | head -1)
          if [ -z "$SRC" ]; then
            echo "Android project not found"
            exit 1
          fi
          DIR=$(dirname "$SRC")
          cp -r "$DIR"/. .
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
